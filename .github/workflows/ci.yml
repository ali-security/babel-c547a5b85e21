name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prepare-yarn-cache:
    name: Prepare Cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: 'Check or update Yarn cache (fix w/ "yarn install")'
        env:
          YARN_ENABLE_HARDENED_MODE: true # enable hardened mode as CI may run on untrusted repos
          YARN_ENABLE_SCRIPTS: false # disable post-install scripts
          YARN_NODE_LINKER: pnp # use pnp linker for better linking performance: it's meant to update yarn cache only
        run: |
          yarn install --mode=skip-build

  yarn-validate:
    name: Validate Yarn dependencies and constraints
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: 'Check for unmet constraints (fix w/ "yarn constraints --fix")'
        run: |
          yarn constraints
      - name: 'Check for duplicate dependencies (fix w/ "yarn dedupe")'
        run: |
          yarn dedupe --check
      - name: Check for dependency cycles
        # todo: investigate why we need to install dependencies here to not get
        # the following error:
        # Internal Error: chalk@condition:BABEL_8_BREAKING ?[...]: This package
        # doesn't seem to be present in your lockfile; run "yarn install" to
        # update the lockfile
        run: |
          yarn
          yarn release-tool check-cycles

  test-esm:
    name: Test ESM version
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # `latest` was Node.js 25 when 7.29.0 was released. It now resolves to
        # Node.js 26, whose require(ESM) change makes mocha's bundled
        # `yargs/yargs` load as ESM under `USE_ESM` and throw.
        node-version: [25.5.0, 24, 22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js ${{matrix.node-version}}
        uses: actions/setup-node@v4
        with:
          node-version: ${{matrix.node-version}}
          check-latest: true
          cache: "yarn"
      - name: Use ESM and build
        run: make use-esm
        env:
          USE_ESM: true
      - name: Test
        run: yarn jest --ci
        env:
          BABEL_ENV: test
          USE_ESM: true

  build:
    name: Build Babel Artifacts
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Yarn PnP does not support native ESM yet (https://github.com/yarnpkg/berry/issues/638)
    # env:
    #    YARN_NODE_LINKER: pnp # use pnp linker for better linking performance and stricter checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Build babel artifacts
        run: |
          make -j build-standalone-ci
        env:
          BABEL_ENV: test-legacy
          BABEL_8_BREAKING: false
          STRIP_BABEL_8_FLAG: true
      - name: Build Makefile.js
        # `--auto` skips the rebuild while the committed bundle's embedded
        # source hash is current. Regenerating it unconditionally no longer
        # reproduces the committed Makefile.mjs: the bundle inlines
        # @babel/preset-env output for the browserslist query "maintained node
        # versions" (scripts/pack-script.js), which is resolved against the
        # current date, so Node.js 20 ageing out since the release emits a
        # legitimately different bundle and trips assert-dir-git-clean below.
        # A real change to Makefile.source.mjs still rebuilds and is still
        # asserted.
        run: |
          node ./scripts/pack-script.js --auto
      - name: Generate readmes
        run: |
          make generate-readme
      - name: Generate .npmignore
        run: |
          node scripts/generators/npm-ignore.js
      - name: Cleanup fixtures
        run: |
          node scripts/cleanup-fixtures.js
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          node ./scripts/assert-dir-git-clean.js "\`make build\` and \`node scripts/cleanup-fixtures.js\`"
      # Bundle the hand-off to the test jobs as a single tar: this artifact is
      # an internal build->test hand-off, and shipping it as thousands of loose
      # files makes the collected artifact set ambiguous.
      - name: Bundle build output for the test jobs
        shell: bash
        run: |
          shopt -s globstar nullglob
          printf '%s\0' \
            codemods/*/lib/**/* \
            eslint/*/lib/**/* \
            packages/*/lib/**/* \
            packages/babel-standalone/*.js \
            packages/babel-runtime/**/*.js \
            packages/babel-runtime-corejs2/**/*.js \
            packages/babel-runtime-corejs3/**/*.js \
            packages/babel-core/src/vendor/* \
            | grep -zv '/node_modules/' > /tmp/babel-artifact-files
          tar --null --no-recursion -cf /tmp/babel-artifact.tar -T /tmp/babel-artifact-files
      - uses: actions/upload-artifact@v4
        with:
          name: babel-artifact
          path: /tmp/babel-artifact.tar
          if-no-files-found: error
          retention-days: 5

  pack-npm-artifact:
    name: Pack npm release tarballs
    needs: prepare-yarn-cache
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      # Reproduce the publish-time build from the `npm-release` job of
      # release.yml (`make prepublish` minus its test run, which the other
      # jobs of this workflow already cover).
      - name: Set module type
        run: node ./scripts/set-module-type.js commonjs
      - name: Build publishable artifacts
        run: make prepublish-build
        env:
          IS_PUBLISH: "true"
          BABEL_8_BREAKING: ""
          FORCE_COLOR: true
      # `make prepublish` ends with this, and release.yml only runs
      # `release-tool publish` afterwards — so the published tarballs are packed
      # with the per-package `lib/package.json` markers removed again.
      - name: Clean module type
        run: node ./scripts/set-module-type.js clean
      - name: Pack @babel/core
        run: |
          mkdir -p /tmp/npm-tarballs
          yarn workspace @babel/core pack --out /tmp/npm-tarballs/core-%v.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarballs
          path: /tmp/npm-tarballs/*.tgz
          if-no-files-found: error
          retention-days: 5

  build-windows:
    name: Build Babel Artifacts on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    # Yarn PnP does not support native ESM yet (https://github.com/yarnpkg/berry/issues/638)
    # env:
    #    YARN_NODE_LINKER: pnp # use pnp linker for better linking performance and stricter checks
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Build babel artifacts
        shell: bash
        run: |
          make -j build-standalone-ci
        env:
          BABEL_ENV: test-legacy
          BABEL_8_BREAKING: false
          STRIP_BABEL_8_FLAG: true
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          node ./scripts/assert-dir-git-clean.js build

  lint:
    name: Lint
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Lint
        run: make -j lint-ci check-compat-data
      - name: Ensure cwd does not contain uncommitted changes
        run: |
          node ./scripts/assert-dir-git-clean.js "lint-ci check-compat-data"

  test-coverage:
    name: Test on Node.js Latest (with coverage)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: |
          yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Run tests
        run: |
          yarn c8 jest --ci
          yarn test:esm
        env:
          BABEL_ENV: test
          BABEL_COVERAGE: true

  test:
    name: Test on Node.js ${{matrix.node-version}}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # 24 is pinned to the patch current at the 7.29.0 release date: 24.19
        # added --test-random-seed and --experimental-test-tag-filter, so the
        # "node flags are up to date" step below fails against it. The other
        # majors are already at their final patch, and none of them is pinned
        # so the `matrix.node-version == '6'` comparisons below still match.
        node-version: [24.13.0, 22, 20, 18, 16, 14, 12, 10, 8, 6]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest # Run yarn on latest node
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: |
          yarn install
      - name: Downgrade Jest and Babel for node <= 10
        if: matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10'
        # `bump-babel-dependencies.js` pins the root `@babel/*` deps to the
        # `latest` dist-tag, which meant Babel 7 at the 7.29.0 release date but
        # now resolves to Babel 8 (ESM) and breaks jest@24 on these legs. Pin
        # the registry to the release date so `latest` means what it did then.
        env:
          YARN_NPM_REGISTRY_SERVER: https://time-machines-npm.sealsecurity.io/
          YARN_NPM_AUTH_TOKEN: "2026-01-31T17:39:22.681Z"
          YARN_NPM_ALWAYS_AUTH: "true"
        run: |
          # It's a bit sarcastic that in this scenario bump-babel-dependencies.js
          # actually downgrades the root `@babel/*` deps from 8.0 alpha to 7
          node ./scripts/integration-tests/utils/bump-babel-dependencies.js
          yarn up jest@24
          cd packages/babel-helper-transform-fixture-test-runner && yarn up jest-diff@24 && cd ../..
          # Deduplicate dependencies, because duplicate copies of graceful-fs cause
          # problems with the "path" module: https://github.com/facebook/jest/issues/9656
          yarn dedupe
      - name: Downgrade Jest and jest-light-runner for node 12
        if: matrix.node-version == '12'
        run: |
          yarn up jest@28
          cd packages/babel-helper-transform-fixture-test-runner && yarn up jest-diff@28 && cd ../..
          yarn up jest-light-runner@0.3.0
          # Deduplicate dependencies, because duplicate copies of graceful-fs cause
          # problems with the "path" module: https://github.com/facebook/jest/issues/9656
          yarn dedupe
      - name: Downgrade Jest and jest-light-runner for node 14 and 16
        if: matrix.node-version == '14' || matrix.node-version == '16'
        run: |
          yarn up jest@29
          cd packages/babel-helper-transform-fixture-test-runner && yarn up jest-diff@28 && cd ../..
          yarn up jest-light-runner@0.5.1
          # Deduplicate dependencies, because duplicate copies of graceful-fs cause
          # problems with the "path" module: https://github.com/facebook/jest/issues/9656
          yarn dedupe
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Use Node.js ${{ matrix.node-version }} # Checkout node version for test executor
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Ensure that @babel/node's list of node flags is up to date
        run: |
          node ./packages/babel-node/scripts/list-node-flags.js
      - name: Test on node.js ${{ matrix.node-version }}
        # Todo(Babel 8): Jest execution path is hardcoded because Yarn 2 does not support node 6
        run: |
          node ./node_modules/.bin/jest --ci
        env:
          BABEL_ENV: test
          TEST_FUZZ: "${{ (matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10') && 'false' || 'true' }}"
      - name: Use Node.js latest # For `yarn version` in post actions of the first actions/setup-node
        if: matrix.node-version == '6' || matrix.node-version == '8' || matrix.node-version == '10'
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs

  test-windows-mac:
    name: Test on
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Test
        run: yarn jest --ci
        env:
          BABEL_ENV: test

  external-parser-tests:
    name: Third-party Parser Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Download tests
        run: make -j bootstrap-flow bootstrap-typescript bootstrap-test262
      - name: Run Test262 Tests
        run: make test-test262
      - name: Run Flow Tests
        run: make test-flow
      - name: Run TypeScript Tests
        run: make test-typescript

  runtime-interop-prepare:
    name: Prepare runtime integration tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      # See https://github.com/babel/babel/pull/12906
      - name: Support self-references on old Node.js
        run: |
          echo '{
            "type": "commonjs",
            "private": true,
            "devDependencies": {
              "@babel/runtime": "workspace:^",
              "@babel/runtime-corejs3": "workspace:^"
            }
          }' > packages/package.json
          node -e "
            const pkg = require('./package.json');
            pkg.workspaces.push('packages');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          "
      - name: Install
        run: yarn install
        env:
          # The "Support self-references on old Node.js" step mutates the
          # package.json file, causing a yarn.lock update.
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Generate absoluteRuntime tests
        run: yarn test:runtime:generate-absolute-runtime
      - name: Test bundlers
        run: yarn test:runtime:bundlers
      - name: Test Node.js latest
        run: node test/runtime-integration/node.cjs

  runtime-interop:
    name: Test @babel/runtime integrations on Node.js
    needs: [build, runtime-interop-prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        node-version:
          [
            10,
            "12.0",
            12.12,
            12.13,
            12.15,
            12.16,
            "13.0",
            13.2,
            13.6,
            13.7,
            14.2,
            16.5,
            16.6,
            22.11,
            22.12,
            "23.10",
          ]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      # See https://github.com/babel/babel/pull/12906
      - name: Support self-references on old Node.js
        run: |
          echo '{
            "type": "commonjs",
            "private": true,
            "devDependencies": {
              "@babel/runtime": "workspace:^",
              "@babel/runtime-corejs3": "workspace:^"
            }
          }' > packages/package.json
          node -e "
            const pkg = require('./package.json');
            pkg.workspaces.push('packages');
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2))
          "
      - name: Install
        run: yarn install
        env:
          # The "Support self-references on old Node.js" step mutates the
          # package.json file, causing a yarn.lock update.
          YARN_ENABLE_IMMUTABLE_INSTALLS: false
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Generate absoluteRuntime tests
        run: yarn test:runtime:generate-absolute-runtime
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Test Node.js ${{ matrix.node-version }}
        run: node test/runtime-integration/node.cjs

  eslint7-test:
    name: Test @babel/eslint-* with ESLint 7.5.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Downgrade ESLint to 7.5.0
        run: yarn up eslint@7.5.0
      - name: Run babel/eslint tests
        run: node ./node_modules/.bin/jest eslint

  eslint8-test:
    name: Test @babel/eslint-* with ESLint 8.0.0
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
          cache: "yarn"
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Downgrade ESLint to 8.0.0
        run: yarn up eslint@8.0.0
      - name: Run babel/eslint tests
        run: node ./node_modules/.bin/jest eslint

  test262-prepare:
    name: test262 - Prepare for running in parallel
    runs-on: ubuntu-latest
    timeout-minutes: 40
    if: github.repository == 'babel/babel'
    steps:
      - name: Checkout Babel
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
      - name: Checkout test runner
        uses: actions/checkout@v4
        with:
          repository: babel/babel-test262-runner
          path: babel-test262-runner
          ref: main
      - name: Download test262
        run: make bootstrap-test262
      - name: Prepare test262 chunks
        run: |
          cd babel-test262-runner
          npm ci
          node lib/prepare-chunks 8 > ~/test262-chunks.json
        env:
          TEST262_PATH: ../build/test262
      - name: Upload chunks artifact
        uses: actions/upload-artifact@v4
        with:
          name: test262-chunks
          path: ~/test262-chunks.json
          retention-days: 30

  test262:
    name: test262
    strategy:
      matrix:
        chunk: [0, 1, 2, 3, 4, 5, 6, 7]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [build, test262-prepare]
    steps:
      - name: Checkout Babel
        uses: actions/checkout@v4
      - name: Use Node.js latest
        uses: actions/setup-node@v4
        with:
          node-version: 25.5.0 # `latest` at the 7.29.0 release date; Node 26's require(ESM) change breaks mocha's bundled yargs
          check-latest: true
      - name: Install
        run: yarn install
      - uses: actions/download-artifact@v4
        with:
          name: babel-artifact
      - name: Unpack build output
        shell: bash
        run: |
          tar -xf babel-artifact.tar
          rm babel-artifact.tar
      - name: Checkout test runner
        uses: actions/checkout@v4
        with:
          repository: babel/babel-test262-runner
          path: babel-test262-runner
          ref: main
      - name: Install test runner
        run: |
          cd babel-test262-runner
          npm ci
          node lib/download-node
      - name: Download test262
        run: make bootstrap-test262
      - name: Download chunks file
        uses: actions/download-artifact@v4
        with:
          name: test262-chunks
      - name: Run test262
        run: |
          cd babel-test262-runner
          node lib/run-tests I_AM_SURE | tee ~/test262-${{ matrix.chunk }}.tap
        # Specify bash to enable pipefail, so that "| tee" does not suppress the failure exit code.
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
        shell: bash
        env:
          BABEL_PATH: ".."
          TEST262_PATH: ../build/test262
          THREADS: 4
          CHUNKS_FILE: ../test262-chunks.json
          CHUNK: ${{ matrix.chunk }}
      - name: Create artifact with report results
        uses: actions/upload-artifact@v4
        with:
          name: test262-result-${{ matrix.chunk }}
          path: ~/test262-${{ matrix.chunk }}.tap
          retention-days: 30

  test262-finish:
    name: test262 - Analyze results
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test262
    steps:
      - uses: actions/download-artifact@v4
        with: { name: test262-result-0 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-1 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-2 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-3 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-4 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-5 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-6 }
      - uses: actions/download-artifact@v4
        with: { name: test262-result-7 }
      - name: Merge chunk results
        run: |
          cat test262-0.tap test262-1.tap test262-2.tap test262-3.tap \
              test262-4.tap test262-5.tap test262-6.tap test262-7.tap \
            | npx tap-merge > test262.tap
      - name: Create artifact with report results
        uses: actions/upload-artifact@v4
        with:
          name: test262-result
          path: test262.tap
      - name: Checkout test runner
        uses: actions/checkout@v4
        with:
          repository: babel/babel-test262-runner
          path: babel-test262-runner
          ref: main
      - name: Download previous results
        run: |
          cd babel-test262-runner
          npm ci
          node lib/download-main-artifact/index.mjs ~/test262-main.tap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: '7.x'
      - name: Compare previous 7.x branch & current results
        run: |
          cd babel-test262-runner
          node lib/compare-results ~/test262-main.tap ../test262.tap | tee ~/diff.tap
        # Specify bash to enable pipefail, so that "| tee" does not suppress the failure exit code.
        # https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#jobsjob_idstepsshell
        shell: bash
